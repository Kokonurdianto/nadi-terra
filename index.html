<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#023720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nadi Terra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nadi Terra Smart Farming</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nadi Terra: platform agribisnis digital Indonesia. Harga komoditas resmi, diagnosa penyakit tanaman, pasar hasil tani, dan forum pakar dalam satu tempat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: aplikasi agribisnis yang ramah HP — foto latar penuh di beranda, kartu harga bergeser, bar tab bawah di HP.
   Warna utama, aksen, logo, dan foto bisa diganti admin (menu Admin > Tampilan). */
:root{
  --brand:#1F9D55; --accent:#F5B82E; --on-brand:#ffffff;
  --bg:#F3F6F1; --surface:#ffffff; --sunken:#EAF0E7; --line:#DCE5D7; --card-bd:transparent;
  --ink:#16241B; --muted:#5B6B60; --foot:#10201A; --foot-ink:#E9F2EB;
  --brand-soft:color-mix(in srgb,var(--brand) 13%,var(--surface));
  --brand-ink:color-mix(in srgb,var(--brand) 80%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface));
  --good:#1E8549; --warn:#A8680C; --bad:#B4392A;
  --good-bg:#DDF1E3; --warn-bg:#FBEBCB; --bad-bg:#F8DDD8;
  --shadow:0 1px 2px rgba(22,40,28,.05),0 8px 24px rgba(22,40,28,.07);
  --r:20px;
  --f-head:"Lexend",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  /* nama lama, dipakai beberapa bagian halaman */
  --palm:var(--brand); --palm-soft:var(--brand-soft); --kunyit:var(--accent); --kunyit-soft:var(--accent-soft);
  --f-display:var(--f-head); --f-mono:var(--f-body); --hero:var(--foot); --hero-ink:var(--foot-ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --sunken:#1D2822; --line:#2A3830; --card-bd:#26332B;
  --ink:#E7EFE8; --muted:#A0B1A4; --foot:#0A120D;
  --brand-ink:color-mix(in srgb,var(--brand) 55%,#fff);
  --brand-soft:color-mix(in srgb,var(--brand) 22%,var(--surface));
  --good:#7FCF98; --warn:#F1B84A; --bad:#F08E7E;
  --good-bg:#1C3727; --warn-bg:#3A2D12; --bad-bg:#3D1E19;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --sunken:#1D2822; --line:#2A3830; --card-bd:#26332B;
  --ink:#E7EFE8; --muted:#A0B1A4; --foot:#0A120D;
  --brand-ink:color-mix(in srgb,var(--brand) 55%,#fff);
  --brand-soft:color-mix(in srgb,var(--brand) 22%,var(--surface));
  --good:#7FCF98; --warn:#F1B84A; --bad:#F08E7E;
  --good-bg:#1C3727; --warn-bg:#3A2D12; --bad-bg:#3D1E19;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.18;letter-spacing:-.01em;text-wrap:balance;font-weight:600}
p{margin:0}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1160px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);padding:4px 12px;border-radius:999px}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:16px;height:68px;position:relative}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);min-width:0}
.lg{width:42px;height:42px;border-radius:13px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--brand)}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.lg svg{width:28px;height:28px}
.logo b{font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.1;display:block;white-space:nowrap}
.logo small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap}
.menu{display:flex;gap:2px;margin-left:auto;align-items:center}
.menu a{padding:9px 13px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.menu a:hover{background:var(--sunken)}
.menu a.on{background:var(--brand-soft);color:var(--brand-ink)}
.menu a.cta{background:var(--brand);color:var(--on-brand);margin-left:6px}
.burger{display:none;margin-left:auto;background:var(--sunken);border:0;border-radius:999px;padding:9px 16px;font-weight:700}
.tabbar{display:none}

/* ---------- tombol, label, kartu ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);font-weight:800;text-decoration:none;font-size:15.5px;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 28%,transparent)}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.kun{background:var(--accent);color:#1d1503;box-shadow:none}
.btn.ghost{background:transparent;color:var(--brand-ink);border:1.5px solid color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:none}
.btn.light{background:#fff;color:#14231a;box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:999px;white-space:nowrap}
.ok{background:var(--good-bg);color:var(--good)}.wn{background:var(--warn-bg);color:var(--warn)}.bd{background:var(--bad-bg);color:var(--bad)}.nt{background:var(--sunken);color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.live.ok::before{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.card{background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
.note{font-size:14px;background:var(--accent-soft);border-radius:14px;padding:12px 16px;color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}

/* ---------- beranda ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;border-radius:0 0 34px 34px;background:#1d3a26}
.hero .bg{position:absolute;inset:0;z-index:-2}
.hero .bg img,.hero .bg svg{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,18,10,.2) 0%,rgba(6,18,10,.45) 45%,rgba(6,18,10,.78) 100%)}
.hero-in{padding-block:84px 112px}
.hero .tag{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:700;max-width:15em;margin-top:18px;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.hero .lead{font-size:clamp(16px,1.6vw,19px);max-width:36em;margin-top:16px;opacity:.94}
.qsearch{display:flex;align-items:center;gap:8px;background:#fff;color:#16241B;border-radius:999px;padding:6px 6px 6px 18px;max-width:580px;margin-top:28px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.qsearch svg{flex:none;color:#5B6B60}
.qsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:10px 4px;color:#16241B}
.qsearch input::placeholder{color:#7a8a7f}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quick a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.quick a:hover{background:rgba(255,255,255,.24)}
.lift{margin-top:-64px;position:relative;z-index:2}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:clamp(22px,2.6vw,30px)}
.sec-h a{font-weight:800;text-decoration:none;white-space:nowrap}
.lift .sec-h h2,.lift .sec-h a{color:#fff}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.pc{scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.pc:hover{outline:2px solid var(--brand-soft)}
.pc .top-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pc .kat{font-size:12.5px;font-weight:800;color:var(--brand-ink)}
.pc .nm{font-family:var(--f-head);font-weight:600;font-size:16.5px;line-height:1.3;margin-top:6px;overflow-wrap:anywhere}
.pc .pr{font-size:26px;font-weight:800;margin-top:4px;line-height:1.1}
.pc .pr small{font-size:13px;font-weight:600;color:var(--muted)}
.pc .ft{font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px}
section.s{padding-block:56px 0}
section.s.last{padding-block:56px 72px}
.svc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.sv{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.sv .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.sv:nth-child(2) .ic,.sv:nth-child(4) .ic{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 55%,var(--ink))}
.sv .ic svg{width:28px;height:28px}
.sv h3{font-size:17.5px}
.sv p{font-size:14.5px;color:var(--muted)}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:center}
.about-img{border-radius:28px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--sunken)}
.about-img img,.about-img svg{width:100%;height:100%;object-fit:cover;display:block}
.about h2{font-size:clamp(24px,3vw,34px);margin-top:12px}
.steps4{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:16px;counter-reset:st}
.steps4 li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:st}
.steps4 li::before{content:counter(st);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-family:var(--f-head);font-weight:700;font-size:18px}
.steps4 b{font-family:var(--f-head);font-weight:600;font-size:17px;display:block}
.steps4 p{color:var(--muted);font-size:15px}
.who{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.who .card{display:flex;flex-direction:column;gap:6px}
.who h3{font-size:17px}
.who p{font-size:14.5px}
.cta{background:var(--brand);color:var(--on-brand);border-radius:30px;padding:clamp(26px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.3fr) auto;gap:24px;align-items:center}
.cta h2{font-size:clamp(22px,2.8vw,32px)}
.cta p{opacity:.9;margin-top:8px}
.sdg{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sdg span{background:color-mix(in srgb,var(--on-brand) 14%,transparent);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px}
.cta .acts{display:flex;flex-direction:column;gap:10px}
.cta .btn.ghost{color:var(--on-brand);border-color:color-mix(in srgb,var(--on-brand) 50%,transparent)}

/* ---------- halaman modul ---------- */
.ph{padding-block:34px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:clamp(28px,4vw,42px);font-weight:700;margin-top:10px}
.ph p{margin-top:8px;max-width:40em;color:var(--muted)}
.pg{padding-bottom:64px;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14.5px;outline:1px solid var(--card-bd)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);width:280px;max-width:100%}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12.5px;font-weight:800;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--sunken)}
.tbl tr.sel td{background:var(--brand-soft)}
.r{text-align:right}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.wait{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.fld input,.fld select,.fld textarea{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-weight:500;font-size:15.5px;width:100%}
.fld input[type=color]{padding:4px;height:46px;cursor:pointer}
.fld .hint{font-weight:500;color:var(--muted);font-size:13px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:800}
.steps span{padding:7px 14px;border-radius:999px;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.steps span.on{background:var(--brand);color:var(--on-brand)}
.crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.crop{background:var(--surface);border:2px solid transparent;border-radius:var(--r);padding:20px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.crop:hover{border-color:var(--brand)}
.crop b{font-family:var(--f-head);font-weight:600;font-size:18px}
.crop small{color:var(--muted)}
.sym{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sym label{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer}
.sym input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--brand)}
.sym label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.res{display:flex;flex-direction:column;gap:14px}
.dx{background:var(--surface);border:1px solid var(--card-bd);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:relative}
.dx:first-child{outline:2px solid var(--brand)}
.dx h3{font-size:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dx ul{margin:10px 0 0;padding-left:20px}
.dx li+li{margin-top:4px}
.meter{height:8px;background:var(--sunken);border-radius:9px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:9px}
.listings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lst{display:flex;flex-direction:column;gap:8px}
.lst h3{font-size:18px;overflow-wrap:anywhere}
.lst .price{font-size:22px;font-weight:800;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.lst .meta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.lst .wa{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--sunken);border-radius:14px;padding:8px 10px 8px 14px;font-size:14px;margin-top:auto}
.thread{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.thread:last-child{border:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-head)}
.thread h4{font-size:17px;overflow-wrap:anywhere}
.thread .meta{font-size:13px;color:var(--muted);margin-top:2px}
.thread p{overflow-wrap:anywhere;white-space:pre-line}
.reply{white-space:pre-line;margin-top:8px;background:var(--sunken);border-radius:14px;padding:10px 14px;font-size:14.5px;overflow-wrap:anywhere}
.reply.pk{background:var(--brand-soft)}
.rform{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.rform .row2{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:end}
.techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tech h3{font-size:19px;margin:10px 0 6px}
.tech dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:12px 0 0}
.tech dt{color:var(--muted);font-weight:700}.tech dd{margin:0}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:14px}
.plan.hl{outline:2px solid var(--brand)}
.plan .amt{font-family:var(--f-head);font-size:34px;font-weight:700}
.plan .amt small{font-size:14px;font-weight:500;color:var(--muted);font-family:var(--f-body)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.plan li{padding-left:26px;position:relative}
.plan li::before{content:"";position:absolute;left:3px;top:8px;width:12px;height:7px;border-left:2.5px solid var(--brand);border-bottom:2.5px solid var(--brand);transform:rotate(-45deg)}
.plan .btn{margin-top:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);padding:6px;border-radius:999px;box-shadow:var(--shadow);align-self:flex-start;max-width:100%}
.tabs button{background:none;border:0;padding:9px 18px;font-weight:800;color:var(--muted);border-radius:999px}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.adm-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.adm-row:last-child{border:0}
.adm-row.sub{margin-left:10px;padding-left:14px;border-left:3px solid var(--line)}

    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('File ini bukan gambar yang bisa dibaca. Pakai JPG, PNG, atau WEBP.'));i.src=url});
    const s=Math.min(1,maxW/img.naturalWidth),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const blob=(type,qual)=>new Promise(ok=>c.toBlob(ok,type,qual));
    if(keepPng)return await blob('image/png');
    let b=await blob('image/webp',.86);if(!b||b.type!=='image/webp')b=await blob('image/jpeg',.86);return b;
  }finally{URL.revokeObjectURL(url)}
}
async function unggah(file,jenis){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw new Error('Pakai gambar JPG, PNG, atau WEBP.');
  if(file.size>15*1024*1024)throw new Error('Ukuran gambar maksimal 15 MB.');
  const blob=await kecilkan(file,jenis==='logo'?512:1920,jenis==='logo'&&file.type==='image/png');
  if(!LIVE)return await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(blob)});
  const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';
  const path=`${jenis}-${Date.now()}.${ext}`;
  const {error}=await withTimeout(sb.storage.from('tampilan').upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false}),30000);
  if(error)throw new Error(/bucket|not found/i.test(error.message)?'Tempat penyimpanan gambar belum dibuat. Jalankan file supabase/tampilan.sql di Supabase.':errMsg(error));
  return sb.storage.from('tampilan').getPublicUrl(path).data.publicUrl;
}

function loadingOr(key,html){if(S.err[key])return`<div class="empty"><p>${esc(S.err[key])}</p><button class="btn sm ghost" data-retry="${key}" style="margin-top:10px">Coba lagi</button></div>`;return html}
function fill(key){
  if(cur==='admin'&&ui.tab==='ringkasan'&&$('#st-iklan'))loadRingkasan();
  if(key==='harga'){fillTicker();if(cur==='harga'){fillHargaList();fillHargaDetail();fillWait()}}
  if(key==='iklan'){if(cur==='pasar')fillIklan();if(cur==='admin'&&ui.tab==='moderasi')fillMod()}
  if(key==='tanya'){if(cur==='forum')fillTanya();if(cur==='admin'&&ui.tab==='moderasi')fillMod()}
  $$('[data-retry]').forEach(b=>b.onclick=()=>{S.err[b.dataset.retry]=null;load(b.dataset.retry)});
}
function fillTicker(){
  const el=$('#ticker');if(!el)return;
  if(S.err.harga){el.innerHTML=`<div class="pc"><span class="muted">${esc(S.err.harga)}</span></div>`;return}
  if(!S.harga)return;
  const rows=S.harga.slice().sort((a,b)=>(a.metode==='contoh')-(b.metode==='contoh')||(b.periode_mulai>a.periode_mulai?1:-1)).slice(0,8);
  el.innerHTML=rows.length?rows.map(r=>`<a class="pc" href="#harga" data-pick="${esc(r.komoditas+'|'+r.wilayah)}"><span class="top-row"><span class="kat">${esc(r.kategori)}</span>${metodeBadge(r)}</span>
    <span class="nm">${esc(r.komoditas)}</span><span class="pr num"><span data-cu="${r.harga}" data-fmt="rp">${rp(r.harga)}</span><small> / ${esc(r.satuan)}</small></span><span class="num small">${chg(r)}</span>
    <span class="ft">${esc(r.wilayah)} · ${periode(r)}</span></a>`).join(''):'<div class="pc"><span class="muted">Belum ada data harga.</span></div>';
  el.removeAttribute('aria-busy');if(rows.length&&!el.dataset.anim){el.dataset.anim='1';countUpAll(el)}
  $$('[data-pick]').forEach(a=>a.onclick=()=>{ui.sel=a.dataset.pick;ui.q='';ui.kat='Semua'});
}
const hkey=r=>r.komoditas+'|'+r.wilayah;
function hargaFiltered(){return (S.harga||[]).filter(r=>(ui.kat==='Semua'||r.kategori===ui.kat)&&r.komoditas.toLowerCase().includes(ui.q.toLowerCase())).sort((a,b)=>a.kategori.localeCompare(b.kategori)||a.komoditas.localeCompare(b.komoditas))}
function fillHargaList(){
  const el=$('#hlist');if(!el)return;
  if(!S.harga&&!S.err.harga){el.innerHTML=skRows(4);return}
  const rows=hargaFiltered();
  if(rows.length&&(!ui.sel||!rows.find(r=>hkey(r)===ui.sel)))ui.sel=hkey(rows[0]);
  el.innerHTML=loadingOr('harga',rows.length?`<div class="tblw"><table class="tbl"><thead><tr><th>Komoditas</th><th class="r">Harga</th><th class="r">Perubahan</th><th>Periode</th><th>Asal data</th></tr></thead><tbody>
   ${rows.map(r=>`<tr class="click ${hkey(r)===ui.sel?'sel':''}" data-h="${esc(hkey(r))}" tabindex="0"><td><b>${esc(r.komoditas)}</b><br><span class="muted small">${esc(r.wilayah)} · ${esc(r.tingkat)}</span></td><td class="r num">${rp(r.harga)}<br><span class="muted small">/ ${esc(r.satuan)}</span></td><td class="r num">${chg(r)}</td><td class="small">${periode(r)}</td><td>${metodeBadge(r)}</td></tr>`).join('')}
   </tbody></table></div>`:`<div class="empty">${S.harga.length?'Tidak ada komoditas yang cocok.':'Belum ada data harga. Admin dapat menambahkannya di halaman Admin.'}</div>`);
  $$('[data-h]').forEach(tr=>{const go=()=>{ui.sel=tr.dataset.h;fillHargaList();fillHargaDetail()};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});
}
async function fillHargaDetail(){
  const el=$('#hdetail');if(!el)return;
  const r=(S.harga||[]).find(x=>hkey(x)===ui.sel);
  if(!r){el.innerHTML='<p class="muted">Pilih komoditas untuk melihat detail.</p>';return}
  const key=r.komoditas+'|'+r.wilayah;
  el.innerHTML=`<div><span class="pill nt">${esc(r.kategori)}</span> ${metodeBadge(r)}<h2 style="font-size:23px;margin-top:8px">${esc(r.komoditas)}</h2>
    <p style="margin-top:6px"><b class="num" style="font-size:28px">${rp(r.harga)}</b> <span class="muted">/ ${esc(r.satuan)}</span> &nbsp;<span class="num">${chg(r)}</span></p>
    <p class="muted small" style="margin-top:4px">${esc(r.wilayah)} · harga ${esc(r.tingkat)} · periode ${periode(r)}</p></div>
    <div class="chart" id="hchart">${sk('100%',180)}</div>
    <p class="small">Sumber: ${safeUrl(r.sumber_url)?`<a href="${esc(r.sumber_url)}" target="_blank" rel="noopener">${esc(r.sumber)}</a>`:esc(r.sumber)}${r.catatan?`<br><span class="muted">${esc(r.catatan)}</span>`:''}</p>
    <div style="border-top:1px solid var(--line);padding-top:14px"><b>Hitung nilai jual</b><div class="fg" style="margin-top:10px;align-items:end"><label class="fld">Jumlah (${esc(r.satuan)})<input id="calc" type="number" min="0" inputmode="decimal" value="1000"></label><p style="padding-bottom:10px">≈ <b class="num" id="calco"></b></p></div></div>`;
  const c=$('#calc'),o=$('#calco');const u=()=>o.textContent=rp(Math.round((+c.value||0)*r.harga));c.oninput=u;u();
  try{ if(!S.hist[key])S.hist[key]=await API.hist(r.komoditas,r.wilayah);
    const ch=$('#hchart');if(ch&&ui.sel===key)ch.innerHTML=histChart(S.hist[key],r);
  }catch(e){const ch=$('#hchart');if(ch)ch.innerHTML=`<p class="muted small">${esc(errMsg(e))}</p>`}
}
function histChart(h,r){
  if(h.length<2)return'<p class="muted small">Riwayat akan muncul setelah ada minimal dua periode data.</p>';
  const W=560,H=220,pl=74,pr=16,pt=16,pb=30,v=h.map(x=>+x.harga);
  let mn=Math.min(...v),mx=Math.max(...v);const pad=(mx-mn)*.15||mx*.02;mn-=pad;mx+=pad;
  const x=i=>pl+i*(W-pl-pr)/(h.length-1),y=val=>pt+(mx-val)*(H-pt-pb)/(mx-mn);
  let g='';for(let j=0;j<=3;j++){const val=mn+(mx-mn)*j/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(val)+3}" text-anchor="end">${Math.round(val).toLocaleString('id-ID')}</text>`}
  const step=Math.ceil(h.length/6);h.forEach((p,i)=>{if(i%step===0||i===h.length-1){const d=new Date(p.periode_mulai+'T00:00:00');g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${d.getDate()} ${BLN[d.getMonth()]}</text>`}});
  const pts=v.map((val,i)=>`${x(i)},${y(val)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Riwayat harga ${esc(r.komoditas)}">${g}<polygon points="${x(0)},${y(mn)} ${pts} ${x(v.length-1)},${y(mn)}" fill="var(--palm-soft)"/><polyline points="${pts}" fill="none" stroke="var(--palm)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((val,i)=>`<circle cx="${x(i)}" cy="${y(val)}" r="${i===v.length-1?5:3}" fill="${i===v.length-1?'var(--kunyit)':'var(--palm)'}" stroke="var(--surface)" stroke-width="1.5"><title>${tgl(h[i].periode_mulai)}: ${rp(val)}</title></circle>`).join('')}</svg><p class="muted small">Riwayat ${h.length} periode, sumbu tegak dalam rupiah per ${esc(r.satuan)}.</p>`;
}
function fillWait(){
  const el=$('#hwait');if(!el||!S.harga)return;
  const ada=new Set(S.harga.filter(r=>r.metode!=='contoh').map(r=>r.komoditas));
  const miss=STRATEGIS.filter(s=>!ada.has(s[0]));
  el.innerHTML=miss.length?miss.map(s=>`<span class="pill nt">${esc(s[0])}</span>`).join(''):'<span class="pill ok">Semua komoditas strategis sudah punya data</span>';
}
function fillIklan(){
  const el=$('#mlist');if(!el)return;
  if(!S.iklan&&!S.err.iklan){el.innerHTML=skLst(3);return}
  const rows=(S.iklan||[]).filter(x=>x.status==='tayang'&&(ui.mf==='Semua'||x.jenis===ui.mf));

     <h3>${esc(x.barang)}</h3><div class="price">${/^\d/.test(x.harga)?'Rp'+esc(x.harga):esc(x.harga)}</div>
     <div class="meta">${esc(x.jumlah)}<br>${esc(x.lokasi)} · ${esc(x.nama)}</div>
     <div class="wa"><span>WA: <b class="num" style="user-select:all">${esc(x.whatsapp)}</b></span><button class="btn sm ghost" data-copy="${esc(x.whatsapp)}">Salin</button></div></div>`).join(''):'<div class="card empty">Belum ada iklan. Jadilah yang pertama memasang iklan.</div>');
  bindCopy();
}
function fillTanya(){
  const el=$('#flist');if(!el)return;
  const draf={n:$('#rn')?.value,i:$('#ri')?.value,fokus:document.activeElement&&document.activeElement.id};
  if(!S.tanya&&!S.err.tanya){el.innerHTML=skThread(3);return}
  const rows=(S.tanya||[]).filter(t=>t.status==='tayang');
  el.innerHTML=loadingOr('tanya',rows.length?rows.map(t=>{const js=(t.jawaban||[]).filter(j=>j.status==='tayang').sort((a,b)=>b.is_pakar-a.is_pakar||(a.created_at<b.created_at?-1:1));
    return `<div class="thread"><div class="av">${esc((t.nama||'?')[0].toUpperCase())}</div><div style="min-width:0;flex:1"><h4>${esc(t.judul)}</h4><p class="meta">${esc(t.nama)} · ${esc(t.komoditas)} · ${lalu(t.created_at)}</p><p style="margin-top:6px">${esc(t.isi)}</p>
    ${js.map(j=>`<div class="reply ${j.is_pakar?'pk':''}">${j.is_pakar?'<span class="pill ok" style="margin-right:6px">Pakar</span>':''}${S.admin&&LIVE?`<button class="btn sm danger hidej" data-hidej="${j.id}">Sembunyikan</button>`:''}<b>${esc(j.nama)}:</b> ${esc(j.isi)}</div>`).join('')}
    ${js.some(j=>j.is_pakar)?'':'<p class="pill wn" style="margin-top:10px">Menunggu jawaban pakar</p>'}
    ${ui.reply===t.id?`<form class="rform" data-rf="${t.id}"><label class="fld">Nama<input id="rn" required minlength="2" maxlength="40" value="${S.admin?'Tim Pakar Nadi Terra':''}"></label><label class="fld">Jawaban<textarea id="ri" rows="5" required minlength="2" maxlength="4000" placeholder="Tulis jawaban selengkapnya. Boleh beberapa paragraf."></textarea><span class="hint" data-count="ri"></span></label>${S.admin?'<label class="chk"><input type="checkbox" id="rp" checked> Jawab sebagai pakar</label>':''}<div class="acts-row"><button class="btn sm" id="rsub">Kirim jawaban</button><button type="button" class="btn sm ghost" id="rbatal">Batal</button></div></form>`:`<button class="btn sm ghost" data-reply="${t.id}" style="margin-top:10px">Jawab</button>`}
    </div></div>`}).join(''):'<div class="empty">Belum ada pertanyaan.</div>');
  if(draf.i!=null&&$('#ri')){$('#ri').value=draf.i;if(draf.n!=null)$('#rn').value=draf.n;if(draf.fokus)$('#'+draf.fokus)?.focus()}
  bindCount();
  $$('[data-hidej]').forEach(b=>b.onclick=async()=>{const w=b.parentElement;b.outerHTML=`<span class="hidej" style="float:right;display:flex;gap:6px;margin-left:10px"><button class="btn sm danger" data-yes style="padding:3px 10px;font-size:12.5px">Ya, sembunyikan</button><button class="btn sm ghost" data-no style="padding:3px 10px;font-size:12.5px">Batal</button></span>`;
    w.querySelector('[data-no]').onclick=()=>fillTanya();
    w.querySelector('[data-yes]').onclick=async()=>{try{await API.setStatus('jawaban',+b.dataset.hidej,'disembunyikan');toast('Jawaban disembunyikan. Pertanyaannya tetap tampil.');load('tanya')}catch(e){toast(errMsg(e))}}});
  const rb=$('#rbatal');if(rb)rb.onclick=()=>{ui.reply=null;fillTanya()};

    catch(err){toast(errMsg(err));btn.disabled=false}});
}

const DIAM=()=>matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const sk=(w,h,mt=0)=>`<span class="skel" style="width:${w};height:${h}px;margin-top:${mt}px"></span>`;
const skPc=n=>Array.from({length:n},()=>`<div class="pc" aria-hidden="true">${sk('40%',12)}${sk('85%',16,10)}${sk('60%',28,8)}${sk('45%',12,16)}</div>`).join('');
const skRows=n=>`<div aria-hidden="true" style="padding:12px;display:flex;flex-direction:column;gap:16px">${Array.from({length:n},()=>`<div style="display:flex;gap:16px;align-items:center"><div style="flex:1;display:flex;flex-direction:column;gap:8px">${sk('55%',14)}${sk('35%',11)}</div>${sk('80px',18)}</div>`).join('')}</div>`;
const skLst=n=>Array.from({length:n},()=>`<div class="card lst" aria-hidden="true">${sk('30%',20)}${sk('75%',18,8)}${sk('45%',24,6)}${sk('90%',12,6)}${sk('100%',38,10)}</div>`).join('');
const skThread=n=>Array.from({length:n},()=>`<div class="thread" aria-hidden="true"><span class="skel" style="width:42px;height:42px;border-radius:50%;flex:none"></span><div style="flex:1;display:flex;flex-direction:column;gap:8px">${sk('70%',16)}${sk('40%',11)}${sk('95%',12,4)}${sk('80%',12)}</div></div>`).join('');
function countUp(el,to,fmt){
  if(DIAM()||!isFinite(to)){el.textContent=fmt(to);return}
  const t0=performance.now(),d=750;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(p<1?Math.round(to*e):to);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function countUpAll(root){$$('[data-cu]').forEach(el=>{if(root&&!root.contains(el))return;const v=+el.dataset.cu;const f=el.dataset.fmt==='rp'?rp:(n=>Number(n).toLocaleString('id-ID'));countUp(el,v,f)})}

const wib=iso=>new Date(new Date(iso).getTime()+7*3600e3).toISOString().slice(0,10);
function fillRingkasan(){
  if(!$('#st-iklan'))return;
  if(S.rkErr){$('#rk-bar').innerHTML=`<p class="muted">${esc(S.rkErr)}</p>`;return}
  const d=S.rk;if(!d)return;
  const now=Date.now(),wk=now-7*86400e3;
  const aktif=d.iklan.filter(x=>x.status==='tayang'),jual=aktif.filter(x=>x.jenis==='Jual').length,beli=aktif.length-jual;
  const tunggu=d.tanya.filter(t=>t.status==='tayang'&&!(t.jawaban||[]).some(j=>j.is_pakar&&j.status==='tayang'));
  const jawabMinggu=d.tanya.reduce((a,t)=>a+(t.jawaban||[]).filter(j=>new Date(j.created_at)>=wk).length,0);
  const iklanBaru=d.iklan.filter(x=>new Date(x.created_at)>=wk).length;
  const kom=new Set((S.harga||[]).filter(r=>r.metode!=='contoh').map(r=>r.komoditas)).size;
  const card=(k,ic,v,l,s,cls='')=>{const el=$('#st-'+k);el.className='card stat '+cls;el.innerHTML=`<span class="ic">${ic}</span><span class="v" data-cu="${v}">${v}</span><span class="l">${l}</span><span class="s">${s}</span>`};
  card('iklan',IC.market,aktif.length,'Iklan aktif',`${iklanBaru} iklan baru minggu ini`);
  card('tunggu',IC.expert,tunggu.length,'Menunggu pakar',tunggu.length?'Pertanyaan belum dijawab pakar':'Semua pertanyaan sudah dijawab',tunggu.length?'alert':'');
  card('jawab',AIC.moderasi,jawabMinggu,'Jawaban minggu ini','Dari pakar dan komunitas');
  card('kom',IC.price,kom,'Komoditas berharga',`${STRATEGIS.length} komoditas strategis ditargetkan`);
  countUpAll($('.stats'));
  // grafik batang
  const days=[];for(let i=13;i>=0;i--)days.push(new Date(now+7*3600e3-i*86400e3).toISOString().slice(0,10));
  const ci={},ct={};d.iklan.forEach(x=>{const k=wib(x.created_at);ci[k]=(ci[k]||0)+1});d.tanya.forEach(x=>{const k=wib(x.created_at);ct[k]=(ct[k]||0)+1});
  const mx=Math.max(1,...days.map(k=>Math.max(ci[k]||0,ct[k]||0)));const stp=Math.max(1,Math.ceil(mx/4)),top=stp*4;
  const W=640,H=230,pl=30,pr=8,pt=12,pb=30,gw=(W-pl-pr)/14,bw=Math.min(14,gw*.32);
  const y=v=>pt+(top-v)*(H-pt-pb)/top;let g='';
  for(let v=0;v<=top;v+=stp)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  days.forEach((k,i)=>{const cx=pl+gw*i+gw/2,a=ci[k]||0,b=ct[k]||0,dt=new Date(k+'T00:00:00');
    g+=`<g><title>${dt.getDate()} ${BLN[dt.getMonth()]}: ${a} iklan, ${b} pertanyaan</title><rect x="${cx-bw-1}" y="${y(a)}" width="${bw}" height="${Math.max(0,y(0)-y(a))}" rx="4" fill="var(--brand)"/><rect x="${cx+1}" y="${y(b)}" width="${bw}" height="${Math.max(0,y(0)-y(b))}" rx="4" fill="var(--accent)"/></g>`;
    if(i%2===1||i===13)g+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${i===13?'Hari ini':dt.getDate()+' '+BLN[dt.getMonth()]}</text>`});
  const kosong=!days.some(k=>ci[k]||ct[k]);
  $('#rk-bar').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Jumlah iklan dan pertanyaan per hari, 14 hari terakhir">${g}</svg>${kosong?'<p class="muted small">Belum ada iklan atau pertanyaan baru dalam 14 hari terakhir.</p>':''}`;
  // donat jual/beli
  const tot=jual+beli,C=2*Math.PI*54,fr=tot?jual/tot:0;
  $('#rk-donut').innerHTML=tot?`<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="${jual} iklan jual, ${beli} iklan beli"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--accent)" stroke-width="18"/><circle cx="70" cy="70" r="54" fill="none" stroke="var(--brand)" stroke-width="18" stroke-dasharray="${(C*fr).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 70 70)" stroke-linecap="${fr>0&&fr<1?'round':'butt'}"/><text x="70" y="68" text-anchor="middle" class="dn-v">${tot}</text><text x="70" y="88" text-anchor="middle" class="dn-l">iklan</text></svg>
    <div class="legend" style="flex-direction:column;gap:8px"><span><i style="background:var(--brand)"></i>Dijual · <b>${jual}</b> (${Math.round(fr*100)}%)</span><span><i style="background:var(--accent)"></i>Dicari · <b>${beli}</b> (${100-Math.round(fr*100)}%)</span></div></div>`:'<p class="muted">Belum ada iklan aktif.</p>';
  // menunggu pakar
  $('#rk-tunggu').innerHTML=tunggu.length?tunggu.slice(0,5).map(t=>`<div class="adm-row"><div><b>${esc(t.judul)}</b><br><span class="muted small">${esc(t.nama)} · ${esc(t.komoditas)} · ${lalu(t.created_at)}</span></div><a class="btn sm" href="#forum">Jawab</a></div>`).join('')+(tunggu.length>5?`<p class="muted small" style="margin-top:8px">dan ${tunggu.length-5} pertanyaan lainnya</p>`:''):'<p class="muted" style="padding:8px 0">Tidak ada yang menunggu. Mantap.</p>';
  // robot
  let st,tx;
  if(!LIVE){st='nt';tx='Mode demo. Robot aktif setelah database dan GitHub Actions tersambung.'}
  else if(!d.robot){st='bd';tx='Belum ada data dari robot. Jalankan "Tarik harga pangan (PIHPS BI)" di GitHub › Actions.'}
  else{const jam=(now-new Date(d.robot.created_at))/3600e3;st=jam<48?'ok':jam<96?'wn':'bd';
    tx=`Data baru terakhir masuk <b>${lalu(d.robot.created_at)}</b>, harga per ${tgl(d.robot.periode_mulai)}.`+(st==='ok'?' Robot berjalan normal.':st==='wn'?' Mungkin libur akhir pekan, atau robot terlewat. Cek GitHub › Actions bila berlanjut.':' Robot kemungkinan berhenti. Buka GitHub › Actions dan jalankan ulang.')}
  $('#rk-robot').innerHTML=`<div class="health"><span class="hd ${st}">${AIC.robot}</span><div><span class="pill ${st}">${st==='ok'?'Normal':st==='wn'?'Perlu dicek':st==='bd'?'Bermasalah':'Demo'}</span><p style="margin-top:6px">${tx}</p></div></div>`;
}
function adminShell(main){
  const menu=ADM_MENU.filter(m=>LIVE||['ringkasan','pengumuman','tampilan'].includes(m[0]));
  if(!menu.find(m=>m[0]===ui.tab))ui.tab='ringkasan';
  const [jd,ds]=ADM_JUDUL[ui.tab];
  return `<div class="adm-shell"><div class="g"><div class="in adm-grid">
    <aside class="adm-side glass" aria-label="Menu admin">
      <div class="logo"><span class="lg" data-logo></span><span><b data-t="nama">${esc(T.nama)}</b><small>Ruang admin</small></span></div>
      <nav class="adm-nav">${menu.map(([k,l])=>`<button type="button" data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${AIC[k]}<span>${l}</span></button>`).join('')}</nav>
      <div class="adm-foot"><span data-conn>${connPill()}</span>${LIVE?`<p class="small muted" style="overflow-wrap:anywhere">${esc(S.session.user.email)}</p><button class="btn sm ghost" id="logout">Keluar</button>`:''}</div>
    </aside>
    <div class="adm-main">
      ${!LIVE?'<p class="note"><b>Mode demo.</b> Database belum disambungkan. Input harga dan moderasi aktif setelah <b>config.js</b> diisi; pengumuman dan tampilan hanya tersimpan sementara.</p>':''}
      <div class="adm-head"><div>${ui.tab==='ringkasan'?`<p class="muted" style="font-weight:700">${sapaan()}, Admin</p>`:''}<h1>${jd}</h1><p class="muted">${ds}</p></div>
        ${ui.tab==='ringkasan'?`<div class="acts-row">${LIVE?'<button class="btn" data-tab="harga">+ Input harga</button>':''}<button class="btn ghost" data-tab="pengumuman">Tulis pengumuman</button></div>`:''}</div>
      ${main}
    </div></div></div></div>`;
}
function bindAdmin(){
  $$('[data-tab]').forEach(b=>b.onclick=()=>{if(ui.tab==='tampilan'&&b.dataset.tab!=='tampilan'){TD=null}ui.tab=b.dataset.tab;render();scrollTo(0,0)});
  if(ui.tab==='ringkasan'&&$('#st-iklan')){fillRingkasan();loadRingkasan()}
  if(ui.tab==='pengumuman')bindPgmAdmin();
  if(ui.tab==='tampilan')bindTampilan();
}

function render(){
  let v=location.hash.slice(1);if(!P[v])v='beranda';if(v!=='admin')TD=null;cur=v;
  $('#menu').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k===v?'on':''}" ${k===v?'aria-current="page"':''}>${l}</a>`).join('')+`<a href="#paket" class="cta ${v==='paket'?'on':''}">Paket</a>`;
  $('#menu').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
  $('#tabbar').innerHTML=TABS.map(([k,l,ic])=>`<a href="#${k}" class="${k===v?'on':''}" ${k===v?'aria-current="page"':''}>${TI[ic]}<span>${l}</span></a>`).join('');
  $('#app').innerHTML=P[v]();
  applyT(v==='admin'&&TD?TD:T);
  bind(v);
}
function bind(v){
  if(v==='beranda'){fillTicker();$('#qs').onsubmit=e=>{e.preventDefault();ui.q=$('#qsi').value.trim();ui.kat='Semua';ui.sel=null;location.hash='harga'}}
  if(v==='admin'&&(!LIVE||S.admin))bindAdmin();
  if(v==='harga'){
    $$('[data-kat]').forEach(b=>b.onclick=()=>{ui.kat=b.dataset.kat;$$('[data-kat]').forEach(x=>x.setAttribute('aria-pressed',x===b));ui.sel=null;fillHargaList();fillHargaDetail()});
    $('#pq').oninput=e=>{ui.q=e.target.value;ui.sel=null;fillHargaList();fillHargaDetail()};
    fillHargaList();fillHargaDetail();fillWait();
  }
  if(v==='diagnosa'){
    $$('[data-crop]').forEach(b=>b.onclick=()=>{ui.dg={step:2,crop:b.dataset.crop,picked:[]};render()});
    $$('[data-sym]').forEach(c=>c.onchange=()=>{const i=+c.dataset.sym;ui.dg.picked=c.checked?[...ui.dg.picked,i]:ui.dg.picked.filter(x=>x!==i)});
    $$('[data-back]').forEach(b=>b.onclick=()=>{ui.dg.step=+b.dataset.back;if(ui.dg.step===1)ui.dg.picked=[];render()});
    const go=$('#dgo');if(go)go.onclick=()=>{if(!ui.dg.picked.length){toast('Pilih minimal satu gejala');return}ui.dg.step=3;render();scrollTo(0,0)};
  }
  if(v==='pasar'){
    $$('[data-mf]').forEach(b=>b.onclick=()=>{ui.mf=b.dataset.mf;$$('[data-mf]').forEach(x=>x.setAttribute('aria-pressed',x===b));fillIklan()});
    $('#topasang').onclick=()=>{$('#pasang').scrollIntoView({behavior:'smooth'});$('#mk').focus({preventScroll:true})};
    $('#mform').onsubmit=async e=>{e.preventDefault();const g=id=>$('#'+id).value.trim();const btn=$('#msub');btn.disabled=true;
      try{await API.addIklan({jenis:g('mt'),barang:g('mk'),jumlah:g('mq'),harga:g('mh'),lokasi:g('ml'),nama:g('mp'),whatsapp:g('mw')});e.target.reset();toast('Iklan tayang');if(!LIVE)S.iklan=await API.iklan();else await load('iklan');fillIklan();scrollTo({top:0,behavior:'smooth'})}
      catch(err){toast(errMsg(err))}btn.disabled=false};
    fillIklan();
  }
  if(v==='forum'){
    $('#fform').onsubmit=async e=>{e.preventDefault();const g=id=>$('#'+id).value.trim();const btn=$('#fsub');btn.disabled=true;
      try{await API.addTanya({nama:g('fn'),komoditas:g('fk'),judul:g('ft'),isi:g('fb')});e.target.reset();toast('Pertanyaan terkirim');if(!LIVE)S.tanya=await API.tanya();else await load('tanya');fillTanya()}
      catch(err){toast(errMsg(err))}btn.disabled=false};
    fillTanya();bindCount();
  }
  if(v==='paket')$$('[data-plan]').forEach(b=>b.onclick=()=>toast('Paket Premium segera dibuka'));
  if(v==='admin'&&LIVE){
    const lf=$('#lform');if(lf)lf.onsubmit=async e=>{e.preventDefault();const btn=$('#lsub');btn.disabled=true;
      const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
      if(error){toast('Email atau kata sandi salah');btn.disabled=false}};
    const lo=$('#logout');if(lo)lo.onclick=()=>sb.auth.signOut();
    const hf=$('#hform');
    if(hf){
      $('#hm').value=new Date().toISOString().slice(0,10);
      $('#hk').onchange=()=>{const s=STRATEGIS.find(x=>x[0]===$('#hk').value);if(s){$('#hc').value=s[1];$('#hs').value=s[2]}};
      hf.onsubmit=async e=>{e.preventDefault();const g=id=>$('#'+id).value.trim();const btn=$('#hsub');btn.disabled=true;
        const row={komoditas:g('hk'),kategori:g('hc'),tingkat:g('ht'),harga:+g('hh'),satuan:g('hs'),periode_mulai:g('hm'),periode_akhir:g('ha')||null,wilayah:g('hw'),sumber:g('hsr'),sumber_url:g('hu')||null,catatan:g('hn')||null,metode:'admin'};
        if(row.periode_akhir&&row.periode_akhir<row.periode_mulai){toast('Periode akhir tidak boleh sebelum periode mulai');btn.disabled=false;return}
        try{await API.addHarga(row);toast('Harga tersimpan dan langsung tampil');$('#hh').value='';fillRecent();load('harga')}catch(err){toast(errMsg(err))}btn.disabled=false};
      fillRecent();
    }
    if(ui.tab==='moderasi')fillMod();
  }
}
$('#burger').onclick=()=>{const m=$('#menu');const o=m.classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* =====================================================================
   APLIKASI DI HP (PWA): tawaran instal + service worker
   ===================================================================== */
let instPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function tutupInstall(){const el=$('#install');el.hidden=true;try{localStorage.setItem('nt_install_tutup',String(Date.now()))}catch(e){}}
function showInstall(){
  const el=$('#install');if(!el)return;
  let t=0;try{t=+localStorage.getItem('nt_install_tutup')||0}catch(e){}
  if(standalone()||Date.now()-t<7*86400000){el.hidden=true;return}
  const head=`<span class="lg">${logoHTML(T)}</span>`;
  if(instPrompt)el.innerHTML=`${head}<div><b>Pasang aplikasi ${esc(T.nama)}</b><p>Buka lebih cepat langsung dari layar HP.</p></div><button class="btn sm" id="inst-go">Instal</button><button class="x" id="inst-x" aria-label="Tutup">×</button>`;
  else if(isIOS&&matchMedia('(max-width:920px)').matches)el.innerHTML=`${head}<div><b>Pasang aplikasi ${esc(T.nama)}</b><p>Ketuk ikon <b style="display:inline;font-size:13px">Bagikan</b> di Safari, lalu pilih <b style="display:inline;font-size:13px">Tambahkan ke Layar Utama</b>.</p></div><button class="x" id="inst-x" aria-label="Tutup">×</button>`;
  else{el.hidden=true;return}
  el.hidden=false;
  $('#inst-x').onclick=tutupInstall;
  const go=$('#inst-go');if(go)go.onclick=async()=>{const pr=instPrompt;instPrompt=null;el.hidden=true;try{await pr.prompt();const r=await pr.userChoice;if(r&&r.outcome!=='accepted')tutupInstall()}catch(e){}};
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instPrompt=e;setTimeout(showInstall,1500)});
addEventListener('appinstalled',()=>{instPrompt=null;$('#install').hidden=true;toast('Aplikasi terpasang di layar HP')});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
setTimeout(showInstall,2500);

render();
load('harga');load('iklan');load('tanya');loadT();loadPgm();
initAuth().then(()=>{if(cur==='admin')render()});
startRealtime();
</script>
